<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Hero: Driving School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #gameCanvas { background: #333; display: block; margin: 0 auto; border-left: 5px solid #555; border-right: 5px solid #555; }
        .light { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #222; margin: 2px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="relative shadow-2xl border-8 border-slate-800 rounded-lg overflow-hidden">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="absolute top-4 left-4 right-4 flex justify-between items-start pointer-events-none">
            <div class="bg-black/70 p-3 rounded-lg border border-white/20 text-white">
                <p class="text-[10px] uppercase tracking-widest opacity-70">Safety Score</p>
                <span id="score" class="text-2xl font-black text-yellow-400">0</span>
            </div>
            
            <div class="bg-gray-900 p-2 rounded-xl border-2 border-gray-700 flex flex-col items-center">
                <div id="redL" class="light bg-red-950"></div>
                <div id="yellowL" class="light bg-yellow-950"></div>
                <div id="greenL" class="light bg-green-950"></div>
            </div>
        </div>

        <div id="startScreen" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center p-8 text-center">
            <h1 class="text-white text-4xl font-black mb-4 tracking-tighter">TRAFFIC <span class="text-blue-500">HERO</span></h1>
            <ul class="text-gray-300 text-sm mb-8 space-y-2 text-left list-disc">
                <li>Hold <b>UP ARROW</b> to accelerate</li>
                <li>Release to <b>BRAKE</b> for Red Lights</li>
                <li>Stop <b>BEFORE</b> the Zebra Crossing</li>
            </ul>
            <button onclick="initGame()" class="bg-blue-600 hover:bg-blue-500 text-white px-12 py-4 rounded-full font-bold transition-all shadow-lg shadow-blue-500/30">START ENGINE</button>
        </div>

        <div id="quizScreen" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center p-6">
            <div class="text-red-500 font-bold mb-2 tracking-widest uppercase">Traffic Violation!</div>
            <h2 id="qText" class="text-white text-xl font-bold mb-6 text-center"></h2>
            <div id="qOptions" class="w-full space-y-3"></div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let active = false;
    let score = 0;
    let speed = 0;
    let frame = 0;
    let signal = 'GREEN';
    let player = { x: 175, y: 480, w: 50, h: 80 };
    let zebraY = -200;
    let pedX = -30;
    let isZebraActive = false;

    const questions = [
        { q: "What should you do at a solid Red light?", a: ["Speed through", "Stop completely", "Slow down"], c: 1 },
        { q: "A pedestrian is on the zebra crossing. You...", a: ["Honk", "Wait for them to cross", "Drive around"], c: 1 },
        { q: "Yellow light means...", a: ["Race the light", "Caution/Prepare to stop", "Free turn"], c: 1 }
    ];

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function initGame() {
        document.getElementById('startScreen').classList.add('hidden');
        active = true;
        score = 0;
        updateSignal();
        loop();
    }

    function updateSignal() {
        if (!active) return;
        const cycles = { 'GREEN': ['YELLOW', 5000], 'YELLOW': ['RED', 2000], 'RED': ['GREEN', 4000] };
        const [next, time] = cycles[signal];
        signal = next;
        
        document.getElementById('redL').className = `light ${signal==='RED'?'bg-red-500 shadow-[0_0_15px_red]':'bg-red-950'}`;
        document.getElementById('yellowL').className = `light ${signal==='YELLOW'?'bg-yellow-500 shadow-[0_0_15px_yellow]':'bg-yellow-950'}`;
        document.getElementById('greenL').className = `light ${signal==='GREEN'?'bg-green-500 shadow-[0_0_15px_lime]':'bg-green-950'}`;
        
        setTimeout(updateSignal, time);
    }

    function triggerQuiz(msg) {
        active = false;
        speed = 0;
        const quiz = questions[Math.floor(Math.random()*questions.length)];
        document.getElementById('quizScreen').classList.remove('hidden');
        document.getElementById('qText').innerText = msg + "\n\n" + quiz.q;
        
        const area = document.getElementById('qOptions');
        area.innerHTML = '';
        quiz.a.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = "w-full bg-slate-800 text-white p-4 rounded-lg hover:bg-blue-600 transition";
            b.innerText = opt;
            b.onclick = () => {
                if(i === quiz.c) {
                    document.getElementById('quizScreen').classList.add('hidden');
                    resetHazard();
                    active = true;
                    loop();
                } else {
                    location.reload();
                }
            };
            area.appendChild(b);
        });
    }

    function resetHazard() {
        isZebraActive = false;
        zebraY = -200;
        pedX = -30;
    }

    function loop() {
        if (!active) return;
        ctx.clearRect(0, 0, 400, 600);
        frame++;

        // Acceleration/Braking
        if (keys['ArrowUp']) speed = Math.min(speed + 0.1, 5);
        else speed = Math.max(speed - 0.15, 0);

        if (keys['ArrowLeft'] && player.x > 10) player.x -= 5;
        if (keys['ArrowRight'] && player.x < 340) player.x += 5;

        // Rules Checking
        if (signal === 'RED' && speed > 0.1) {
            triggerQuiz("🚨 RED LIGHT VIOLATION!");
            return;
        }

        // Zebra Crossing Logic
        if (!isZebraActive && frame % 400 === 0) {
            isZebraActive = true;
            zebraY = -150;
            pedX = -30;
        }

        if (isZebraActive) {
            zebraY += speed;
            pedX += 2;
            
            // Draw Zebra
            ctx.fillStyle = "white";
            for(let i=0; i<8; i++) ctx.fillRect(i*55, zebraY, 35, 100);
            
            // Draw Pedestrian
            ctx.fillStyle = "#ffdbac"; ctx.fillRect(pedX, zebraY+20, 20, 20); // Head
            ctx.fillStyle = "#2563eb"; ctx.fillRect(pedX, zebraY+40, 20, 40); // Body

            // Check Zebra Penalty
            if (speed > 0.2 && player.y < zebraY + 100 && player.y + player.h > zebraY) {
                triggerQuiz("🚶 PEDESTRIAN SAFETY VIOLATION!");
                return;
            }

            if (zebraY > 600) {
                isZebraActive = false;
                score += 50;
                document.getElementById('score').innerText = score;
            }
        }

        // Draw Player Car
        ctx.fillStyle = "#3b82f6";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.fillRect(player.x+5, player.y+10, 40, 20); // Windshield

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>

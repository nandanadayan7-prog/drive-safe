<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Safety Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .car-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div id="game-container" class="max-w-md w-full bg-slate-800 rounded-3xl shadow-2xl border-4 border-slate-700 p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-xl font-bold tracking-tight">🚦 TRAFFIC HERO</h1>
            <div class="bg-yellow-400 text-slate-900 px-4 py-1 rounded-full font-black" id="score-display">Score: 0</div>
        </div>

        <div id="screen-content">
            <div class="text-center py-10">
                <div class="text-6xl mb-6 car-bounce">🚗</div>
                <h2 class="text-2xl font-bold mb-4">Are you a safe driver?</h2>
                <p class="text-slate-400 mb-8 text-sm">Follow the rules, earn points, and avoid accidents.</p>
                <button onclick="startGame()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-500/20">
                    START ENGINE
                </button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let currentLevel = 0;

        const scenarios = [
            {
                level: "Traffic Signal",
                icon: "🔴",
                question: "The light is RED. What is your move?",
                options: [
                    { text: "Full Stop", correct: true, feedback: "Perfect! You saved lives.", points: 10 },
                    { text: "Speed Up", correct: false, feedback: "Crash! You jumped a red light.", points: -5 },
                    { text: "Slowly Crawl", correct: false, feedback: "Dangerous! Wait for Green.", points: -5 }
                ]
            },
            {
                level: "Zebra Crossing",
                icon: "🚶‍♂️",
                question: "Pedestrians are waiting to cross. Action?",
                options: [
                    { text: "Honk & Drive", correct: false, feedback: "Rudeness isn't safety!", points: -5 },
                    { text: "Stop and Wait", correct: true, feedback: "Respect! Pedestrians first.", points: 10 },
                    { text: "Overtake", correct: false, feedback: "Very dangerous maneuver!", points: -10 }
                ]
            },
            {
                level: "Speed Limit",
                icon: "🏫",
                question: "You are entering a SCHOOL ZONE.",
                options: [
                    { text: "Maintain 60km/h", correct: false, feedback: "Too fast for children!", points: -5 },
                    { text: "Slow to 20km/h", correct: true, feedback: "Smart! Safety over speed.", points: 10 }
                ]
            }
        ];

        function updateScore(points) {
            score += points;
            document.getElementById('score-display').innerText = `Score: ${score}`;
        }

        function startGame() {
            score = 0;
            currentLevel = 0;
            updateScore(0);
            renderLevel();
        }

        function renderLevel() {
            const level = scenarios[currentLevel];
            const content = document.getElementById('screen-content');
            
            content.innerHTML = `
                <div class="animate-in fade-in duration-500">
                    <p class="text-xs text-blue-400 font-bold uppercase mb-2 tracking-widest">${level.level}</p>
                    <div class="text-7xl text-center my-8">${level.icon}</div>
                    <h2 class="text-xl font-semibold mb-6 text-center">${level.question}</h2>
                    <div class="space-y-3">
                        ${level.options.map((opt, i) => `
                            <button onclick="handleAnswer(${i})" class="w-full text-left bg-slate-700 hover:bg-slate-600 p-4 rounded-xl border border-slate-600 transition-colors">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleAnswer(index) {
            const option = scenarios[currentLevel].options[index];
            const content = document.getElementById('screen-content');
            
            updateScore(option.points);

            content.innerHTML = `
                <div class="text-center py-10 animate-in zoom-in duration-300">
                    <div class="text-5xl mb-4">${option.correct ? '✅' : '❌'}</div>
                    <h2 class="text-2xl font-bold mb-2">${option.correct ? 'Great Job!' : 'Oh No!'}</h2>
                    <p class="text-slate-400 mb-8">${option.feedback}</p>
                    <button onclick="nextStep()" class="w-full bg-slate-100 text-slate-900 font-bold py-4 rounded-2xl">
                        ${currentLevel < scenarios.length - 1 ? 'NEXT LEVEL' : 'SEE RESULTS'}
                    </button>
                </div>
            `;
        }

        function nextStep() {
            if (currentLevel < scenarios.length - 1) {
                currentLevel++;
                renderLevel();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            const content = document.getElementById('screen-content');
            let rank = score >= 25 ? "Gold Driver 🏆" : "Student Driver 🔰";
            
            content.innerHTML = `
                <div class="text-center">
                    <h2 class="text-3xl font-black mb-2 uppercase">Finish Line!</h2>
                    <div class="text-5xl my-6">🏁</div>
                    <p class="text-slate-400 mb-1">Your Final Rank:</p>
                    <p class="text-2xl font-bold text-yellow-400 mb-8">${rank}</p>
                    <button onclick="startGame()" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl">RESTART GAME</button>
                </div>
            `;
        }
    </script>
</body>
</html>
